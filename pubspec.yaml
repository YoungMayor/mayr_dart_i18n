name: mayr_i18n
description: A Dart-based, JSON-powered internationalization (i18n) library.
version: 1.0.0
homepage: https://github.com/YoungMayor/mayr_dart_i18n
repository: https://github.com/YoungMayor/mayr_dart_i18n
issue_tracker: https://github.com/YoungMayor/mayr_dart_i18n/issues
documentation: https://github.com/YoungMayor/mayr_dart_i18n/wiki
LICENSE: MIT

environment:
  sdk: ^3.9.2

dependencies:
  yaml: ^3.1.2
  path: ^1.9.0
  args: ^2.5.0
  io: ^1.0.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

mayr_i18n:
  lang_directory: assets/i18n
  default_locale: en
  env_support: true

executables:
  mayr_i18n:

topics:
  - i18n
  - dart
  - json-translation
  - productivity
  - development
